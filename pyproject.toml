[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-numpy"
version = "0.1.0"
description = "Compute-oriented NumPy kernels implemented in Mojo"
requires-python = ">=3.10"
dependencies = ["numpy"]
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
